<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简单Web服务器</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #333;
        }
        .content {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>欢迎访问简单Web服务器</h1>
        <div class="content">
            <h2>功能特点：</h2>
            <ul>
                <li>支持HTTP/1.0和HTTP/1.1协议</li>
                <li>支持静态文件服务</li>
                <li>支持图片等多媒体文件</li>
                <li>自动处理错误响应</li>
            </ul>
        </div>
    </div>
</body>
</html>
